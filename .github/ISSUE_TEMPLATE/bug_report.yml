name: Bug report
description: Report a problem with KodLyft FSM
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to file a bug. Please fill out the sections below.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
      placeholder: When I ..., the app ...
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Which surface?
      multiple: true
      options:
        - Backend (Frappe / API)
        - Console (back-office)
        - Portal (customer)
        - Mobile (technician)
        - Design system
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: FSM app version, Frappe/ERPNext version, browser/OS or device.
      placeholder: "fsm 0.1.0 · Frappe v16.19 · ERPNext v16.20 · Chrome 132 / Android 14"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / screenshots
      render: shell

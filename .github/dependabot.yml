version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "build"
      include: scope
    groups:
      vue:
        patterns: ["vue", "vue-router", "pinia", "@vitejs/*", "vite", "vue-tsc"]
      tailwind:
        patterns: ["tailwindcss", "@tailwindcss/*"]
      ionic-capacitor:
        patterns: ["@ionic/*", "@capacitor/*", "ionicons"]
      linting:
        patterns: ["eslint*", "@typescript-eslint/*", "prettier", "@commitlint/*", "husky", "lint-staged"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
